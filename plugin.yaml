name: upfront
label: Upfront Prediction
version: "0.4.5"
manifest_version: 1
kind: standalone
requires_hermes: ">=0.23.0"
author: LeMultiFox
license: MIT
homepage: https://github.com/trillionverselabs-boop/upfront-test
tags: [strategy, simulation, stakeholders, decision-review, local-first, research]
description: >-
  See who can kill your plan before you ship it. Upfront Prediction is a
  rehearsal with a scorecard for high-stakes moves: feed it a decision or a URL
  and it simulates stakeholder reactions, names who can challenge the move and
  on what conditions, finds your best response, and reads how competitive the
  market is — then freezes testable claims you grade later, so the rehearsal
  gets sharper every time. Runs on your own machine; no cloud account.
provides_tools:
  - upfront_run
  - upfront_status
  - upfront_report
  - upfront_history
  - upfront_calibration
  - upfront_due
  - upfront_export
capabilities:
  - llm.model_override
# Python dependencies live in pyproject.toml (single source of truth):
#   pydantic>=2.6,<3 · fastapi>=0.110,<1
# Declaring them here too would diverge on the floor, and the validator reads
# pyproject when both exist — a duplicate is dead config a reviewer will flag.
