name: upfront
version: "0.3.0"
requires_hermes: ">=0.23.0"
description: "Upfront — a strategic-response review for decisions. Paste a decision (or a URL), see who can veto it, their coalitions, your best response, and how contested the ground is (red / purple / blue ocean); pick a model from the live catalogue with per-run cost shown, inject a counter-move mid-run, then score the frozen claims later. Local-first."
provides_tools:
  - upfront_run
  - upfront_status
  - upfront_report
  - upfront_history
  - upfront_calibration
  - upfront_due
  - upfront_export
capabilities:
  - llm.model_override
# Python dependencies live in pyproject.toml (single source of truth):
#   pydantic>=2.6,<3 · fastapi>=0.110,<1
# Declaring them here too would diverge on the floor, and the validator reads
# pyproject when both exist — a duplicate is dead config a reviewer will flag.
