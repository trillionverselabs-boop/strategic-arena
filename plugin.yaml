name: upfront
label: Upfront Prediction
version: "0.3.0"
manifest_version: 1
kind: standalone
requires_hermes: ">=0.23.0"
author: LeMultiFox
license: MIT
homepage: https://github.com/trillionverselabs-boop/upfront-test
tags: [strategy, simulation, stakeholders, decision-review, local-first, research]
description: >-
  A rehearsal with a scorecard for high-stakes moves. Feed it a decision (or a
  URL) and it simulates stakeholder reactions, maps coalitions, finds your best
  response, and delivers a competitive read — plus verifiable scorecards to track
  prediction vs. reality. Runs on your own machine. Built for Hermes Agent.
provides_tools:
  - upfront_run
  - upfront_status
  - upfront_report
  - upfront_history
  - upfront_calibration
  - upfront_due
  - upfront_export
capabilities:
  - llm.model_override
# Python dependencies live in pyproject.toml (single source of truth):
#   pydantic>=2.6,<3 · fastapi>=0.110,<1
# Declaring them here too would diverge on the floor, and the validator reads
# pyproject when both exist — a duplicate is dead config a reviewer will flag.
