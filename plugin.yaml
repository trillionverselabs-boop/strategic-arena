name: upfront
label: Strategic Arena
version: "0.6.1"
manifest_version: 1
kind: standalone
requires_hermes: ">=0.23.0"
author: LeMultiFox
license: MIT
homepage: https://github.com/trillionverselabs-boop/upfront-test
tags: [strategy, stakeholders, artefact-review, reception, decision-review, local-first, research]
description: >-
  Read the landscape before it reads you. Give it a link — a repo README, a launch
  post, a whitepaper, a case study, an announcement, a tweet — and Strategic Arena
  puts the people and organisations who will actually react into one room: who has
  real power over the outcome, what each condition costs to meet, how contested the
  ground already is, and what the market will read you as. Then it freezes testable
  claims with dates, and scores them, so the record gets sharper every time. Runs
  on your own machine; no cloud account.
provides_tools:
  - upfront_run
  - upfront_status
  - upfront_report
  - upfront_history
  - upfront_calibration
  - upfront_due
  - upfront_export
capabilities:
  - llm.model_override
# No Python dependencies are declared, on purpose: pydantic and fastapi are
# Hermes core requirements, and a non-empty dependency list makes a
# non-interactive install (the desktop Install from Git / reinstall dialog)
# refuse its consent prompt and abort. See pyproject.toml for the detail.
