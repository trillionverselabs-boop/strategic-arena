name: upfront
label: Upfront
version: "0.3.0"
manifest_version: 1
kind: standalone
requires_hermes: ">=0.23.0"
author: LeMultiFox
license: MIT
homepage: https://github.com/trillionverselabs-boop/upfront-test
tags: [strategy, simulation, stakeholders, decision-review, local-first, research]
description: >-
  See who can challenge your plan before you ship it. Paste a decision (or a URL) and
  Upfront maps the players who can challenge it, their conditions, your best response,
  and how competitive the market is — then freezes testable claims you score later.
  Runs on your own machine. Not a prediction.
provides_tools:
  - upfront_run
  - upfront_status
  - upfront_report
  - upfront_history
  - upfront_calibration
  - upfront_due
  - upfront_export
capabilities:
  - llm.model_override
# Python dependencies live in pyproject.toml (single source of truth):
#   pydantic>=2.6,<3 · fastapi>=0.110,<1
# Declaring them here too would diverge on the floor, and the validator reads
# pyproject when both exist — a duplicate is dead config a reviewer will flag.
