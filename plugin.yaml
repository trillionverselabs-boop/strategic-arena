name: upfront
version: "0.3.0"
requires_hermes: ">=0.23.0"
description: "Upfront — a strategic-response review for decisions. Paste a decision (or a URL), see who can veto it, their coalitions, your best response, and how contested the ground is (red / purple / blue ocean); pick a model from the live catalogue with per-run cost shown, inject a counter-move mid-run, then score the frozen claims later. Local-first."
provides_tools:
  - upfront_run
  - upfront_status
  - upfront_report
  - upfront_history
  - upfront_calibration
  - upfront_due
  - upfront_export
capabilities:
  - llm.model_override
# Rules 10 — floor AND upper bound, not a bare floor on the newest release.
# Floor chosen as the oldest release carrying the API we actually use
# (pydantic v2 BaseModel/Field; fastapi APIRouter/HTTPException).
python_dependencies:
  - "pydantic>=2.0,<3"
  - "fastapi>=0.100,<1"
