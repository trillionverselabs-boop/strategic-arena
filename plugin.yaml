name: strategic-arena
version: "0.6.3"
manifest_version: 1
kind: standalone
requires_hermes: ">=0.23.0"
author: LeMultiFox
license: MIT
homepage: https://github.com/trillionverselabs-boop/strategic-arena
tags: [strategy, stakeholders, artifact-review, reception, decision-review, local-first, research]
description: >-
  A multi-agent simulation plugin for Hermes. Point it at a repo, a paper, a post, a
  case study or an announcement — yours or someone else's — and it maps who will block
  adoption, how competitors react, and whether your strategy holds before you spend
  engineering time or capital.
provides_tools:
  - arena_run
  - arena_status
  - arena_report
  - arena_history
  - arena_calibration
  - arena_due
  - arena_export
# No `capabilities:` block: the plugin asks the host for nothing special any
# more. The model picker needed `llm.model_override`, and the picker is gone —
# a run uses the session's model. Declaring a capability we no longer use would
# fail catalog rule 06 (declared capabilities must match reality), and asking
# for one we do not need is a consent screen for nothing.
# No Python dependencies are declared, on purpose: pydantic and fastapi are
# Hermes core requirements, and a non-empty dependency list makes a
# non-interactive install (the desktop Install from Git / reinstall dialog)
# refuse its consent prompt and abort. See pyproject.toml for the detail.
