name: upfront
version: "0.1.0"
requires_hermes: ">=0.23.0"
description: "Upfront Prediction — a pre-launch opponent. Paste a decision, watch a living stakeholder graph react; it finds the blocker, shows the counter-move, and freezes a prediction you can verify later. Local-first, runs on your active model."
provides_tools:
  - upfront_run
  - upfront_status
  - upfront_report
  - upfront_history
