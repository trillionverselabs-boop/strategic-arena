[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-upfront"
version = "0.3.0"
description = "Upfront — strategic-response review for decisions: who can veto the move, their coalitions, your best response, and how contested the ground is."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "fastapi>=0.110,<1",
]

[project.entry-points."hermes_agent.plugins"]
upfront = "upfront"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
