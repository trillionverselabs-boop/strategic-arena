name: upfront
title: Upfront
description: >-
  A strategic-response review for decisions: paste a decision (or a URL) and see
  who can veto it, the coalitions around it, your best response, and how contested
  the ground is (red / purple / blue ocean). Inject a counter-move mid-run, then
  score the frozen claims later. Runs on your active Hermes model, or on a model
  you pick from the live Nous catalogue (prices shown before you run); fetches
  user-supplied URLs to text (http/https, 200KB cap) and the public model
  catalogue (anonymous, cached 6h).
repo: https://github.com/trillionverselabs-boop/upfront-test   # must be PUBLIC before submission
sha: REPLACE_WITH_40_HEX_COMMIT
tier: community
category: desktop
maintainer: trillionverselabs-boop
version: "0.3.0"
capabilities:
  tools: [upfront_run, upfront_status, upfront_report, upfront_history, upfront_calibration]
  env: []
requires_hermes: ">=0.23.0"
