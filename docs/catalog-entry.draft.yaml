docs_url: https://github.com/trillionverselabs-boop/upfront-test/blob/main/docs/POSITIONING.md
readme: true
known_issues: >-
  Choosing a model for a run needs the llm.model_override consent; without it the run uses your
  active model. Free models are rate-limited and can take 15-30 minutes for a 24h review.
  The desktop UI has been tested on Windows against a remote (SSH) backend: the app loads its
  plugin UI from the machine the window runs on, so a UI change needs Install from Git with the
  Desktop target ticked on that machine (see docs/DESKTOP-UPDATES.md in the repo).
