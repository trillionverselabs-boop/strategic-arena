name: upfront
title: Upfront
description: >-
  A rehearsal with a scorecard for high-stakes moves. Feed it a decision (or a
  URL) and it simulates stakeholder reactions, maps coalitions, finds your best
  response, and delivers a competitive read — plus verifiable scorecards to track
  prediction vs. reality. Runs on your own machine. Built for Hermes Agent.

repo: https://github.com/trillionverselabs-boop/upfront-test   # must be PUBLIC before submission
sha: d357d1aff6fb4b4185223464ffd30177e4021dd7
tier: community
category: general
maintainer: LeMultiFox
version: "0.3.0"
requires_hermes: ">=0.23.0"
capabilities:
  tools:
    - upfront_run
    - upfront_status
    - upfront_report
    - upfront_history
    - upfront_calibration
    - upfront_due
    - upfront_export
  hooks: []
  env: []
image: https://raw.githubusercontent.com/trillionverselabs-boop/upfront-test/d357d1aff6fb4b4185223464ffd30177e4021dd7/assets/banner.png
screenshots:
  - https://raw.githubusercontent.com/trillionverselabs-boop/upfront-test/d357d1aff6fb4b4185223464ffd30177e4021dd7/assets/how-it-works.png
docs_url: https://github.com/trillionverselabs-boop/upfront-test/blob/main/docs/POSITIONING.md
readme: true
known_issues: >-
  Choosing a model for the run requires the llm.model_override consent; without it the run uses
  your active model. Live UI screenshots are pinned in the next entry update.
