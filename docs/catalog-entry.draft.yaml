title: Strategic Arena
# One line: this is what the catalogue card shows. The long form lives in the
# README, which renders on /docs/plugins/strategic-arena at the pinned sha.
description: >-
  Give it a link, get the room that reacts: who can block it, what each concession
  buys, and the claims you can score later. Research papers also get a replication clock.
maintainer: LeMultiFox
tier: community
category: tools
version: "0.6.2"
requires_hermes: ">=0.23.0"
image: https://raw.githubusercontent.com/trillionverselabs-boop/strategic-arena/2082f15c08e682501e0bca88b3b542e8607e6e09/assets/banner.png
screenshots:
  - https://raw.githubusercontent.com/trillionverselabs-boop/strategic-arena/2082f15c08e682501e0bca88b3b542e8607e6e09/assets/how-it-works.png
platforms: []
capabilities:
  provides_tools:
    - arena_run
    - arena_status
    - arena_report
    - arena_history
    - arena_calibration
    - arena_due
    - arena_export
  provides_hooks: []
  provides_middleware: []
  requires_env: []
docs_url: https://github.com/trillionverselabs-boop/strategic-arena/blob/main/docs/POSITIONING.md
readme: true
# known_issues is a list of short strings, shown at the install prompt.
# Informational, never blocks. It was a folded string here, which the schema
# does not allow.
known_issues:
  - "A run uses the model the Hermes session is already on. There is no model picker by design."
  - "Free models are rate-limited — a 24h review can take 15–30 minutes."
  - "The desktop UI loads from the machine running the app, so a UI change needs Install from Git with the Desktop target on that machine."
  - "Generic PDFs outside arXiv cannot be read without a text-layer dependency. A link that cannot be read is reported as SKIPPED in the run's provenance, never silently dropped."
